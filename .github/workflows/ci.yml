name: CI

on:
  push:
    branches: [main, 'feat/**', 'ci-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: L1 — vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: |
          set -o pipefail
          go version
          go vet ./... 2>&1 | tee /tmp/vet.log
      - name: publish vet output to job summary
        if: always()
        run: cat /tmp/vet.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: test
        run: |
          set -o pipefail
          go test ./... -count=1 -race 2>&1 | tee /tmp/vet.log

      - name: build (all binaries incl. osb-checker)
        run: go build ./...

  conformance:
    name: L2 — Conformance-Gate (kind + CNPG + osb-checker)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build broker + checker binaries from PR code
        run: |
          go build -o /tmp/broker .
          go build -o /tmp/osb-checker ./cmd/osb-checker/

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          wait: 30s

      - name: Add CNPG CRDs (idempotent)
        run: |
          kubectl apply --server-side --force-conflicts --field-manager=cnpg-crds \
            -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.1.yaml
          for i in $(seq 1 30); do
            N=$(kubectl get crd 2>/dev/null | grep -c cnpg || true)
            [ "$N" -ge 6 ] && break
            sleep 2
          done
          echo "CNPG CRDs established: $N"

      - name: Install CloudNativePG operator (raw manifest + server-side apply)
        run: |
          set -e
          curl -sSfL -o /tmp/cnpg.yaml \
            https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.1.yaml
          kubectl apply --server-side --force-conflicts --field-manager=cnpg -f /tmp/cnpg.yaml || true
          for i in $(seq 1 30); do
            N=$(kubectl get crd 2>/dev/null | grep -c cnpg || true)
            [ "$N" -ge 6 ] && break
            sleep 2
          done
          echo "CNPG CRDs established: $N"
          kubectl -n cnpg-system delete pod -l app.kubernetes.io/name=cloudnative-pg --ignore-not-found
          kubectl rollout status deployment/cnpg-controller-manager -n cnpg-system --timeout=240s

      - name: Deploy broker under test (PR image)
        run: |
          docker build -q -t osb-broker-go:pr .
          kind load docker-image osb-broker-go:pr --name ci
          kubectl create namespace osb --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic osb-broker-auth -n osb \
            --from-literal=username=chk \
            --from-literal=password=chkpass \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap osb-definitions -n osb \
            --from-file=definitions/ \
            --dry-run=client -o yaml | kubectl apply -f -
          # RBAC zuerst (Propagation-Delay abwarten), dann Broker-Deploy
          kubectl apply -f deploy/k8s/operator-rbac.yaml
          sleep 5
          sed -e 's|image: osb-broker-go:v[0-9]*|image: osb-broker-go:pr|' \
              -e 's|value: \"k8s\"|value: \"memory\"|' \
              deploy/k8s/broker.yaml | kubectl apply -f -
          kubectl rollout status deployment/osb-broker-go -n osb --timeout=120s
          sleep 3
          echo "--- RBAC self-check ---"
          echo "Pod SA: $(kubectl get pod -n osb -l app=osb-broker-go -o jsonpath='{.items[0].spec.serviceAccountName}')"
          echo "Role rules: $(kubectl get role osb-broker-state -n osb -o jsonpath='{.rules}')"
          echo "can-i create cm: $(kubectl auth can-i --as=system:serviceaccount:osb:osb-broker-go create configmaps -n osb)"
          echo "can-i create cm named osb-broker-state: $(kubectl auth can-i --as=system:serviceaccount:osb:osb-broker-go create configmap/osb-broker-state -n osb)"
          kubectl get role,rolebinding -n osb || true

      - name: Run osb-checker against the PR broker
        run: |
          kubectl port-forward -n osb svc/osb-broker-go 18080:80 &
          PF_PID=$!
          sleep 3
          curl -s -o /dev/null -w "healthz: %{http_code}\n" http://localhost:18080/healthz
          set +e
          /tmp/osb-checker --url http://localhost:18080 --user chk --pass chkpass \
            --id-prefix pr-${{ github.event.number }} | tee /tmp/checker.log
          RC=\${PIPESTATUS[0]}
          set -e
          kill $PF_PID 2>/dev/null || true
          echo "$checker_out" > /dev/null || true
          cat /tmp/checker.log >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Upload checker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-log
          path: /tmp/checker.log

  release:
    name: L3 — Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify, conformance]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
