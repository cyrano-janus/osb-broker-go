name: CI

on:
  push:
    branches: [main, 'feat/**', 'ci-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: L1 — vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: |
          set -o pipefail
          go version
          go vet ./... 2>&1 | tee /tmp/vet.log
      - name: publish vet output to job summary
        if: always()
        run: cat /tmp/vet.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: test
        run: |
          set -o pipefail
          go test ./... -count=1 -race 2>&1 | tee /tmp/vet.log

      - name: build (all binaries incl. osb-checker)
        run: go build ./...

  conformance:
    name: L2 — Conformance-Gate (kind + CNPG + osb-checker)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build broker + checker binaries from PR code
        run: |
          go build -o /tmp/broker .
          go build -o /tmp/osb-checker ./cmd/osb-checker/

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          wait: 30s

      - name: Add CNPG CRDs (idempotent)
        run: |
          kubectl apply --server-side --force-conflicts --field-manager=cnpg-crds \
            -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.0/releases/cnpg-1.30.0.yaml
          for i in $(seq 1 30); do
            N=$(kubectl get crd 2>/dev/null | grep -c cnpg || true)
            [ "$N" -ge 6 ] && break
            sleep 2
          done
          echo "CNPG CRDs established: $N"

      - name: Install CloudNativePG operator (raw manifest + server-side apply)
        run: |
          set -e
          curl -sSfL -o /tmp/cnpg.yaml \
            https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.0/releases/cnpg-1.30.0.yaml
          kubectl apply --server-side --force-conflicts --field-manager=cnpg -f /tmp/cnpg.yaml || true
          for i in $(seq 1 30); do
            N=$(kubectl get crd 2>/dev/null | grep -c cnpg || true)
            [ "$N" -ge 6 ] && break
            sleep 2
          done
          echo "CNPG CRDs established: $N"
          kubectl -n cnpg-system delete pod -l app.kubernetes.io/name=cloudnative-pg --ignore-not-found
          kubectl rollout status deployment/cnpg-controller-manager -n cnpg-system --timeout=240s

      - name: Deploy broker under test (PR image)
        run: |
          docker build -q -t osb-broker-go:pr .
          kind load docker-image osb-broker-go:pr --name ci
          # Phase 5: der Zustand liegt in eigenen CRDs. Ohne sie startet der
          # Broker zwar, aber jedes Provision scheitert.
          kubectl apply -f deploy/crds/
          kubectl wait --for condition=established --timeout=60s \
            crd/osbserviceinstances.broker.osb.io crd/osbservicebindings.broker.osb.io
          kubectl create namespace osb --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic osb-broker-auth -n osb \
            --from-literal=username=chk \
            --from-literal=password=chkpass \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap osb-definitions -n osb \
            --from-file=definitions/ \
            --dry-run=client -o yaml | kubectl apply -f -
          # RBAC zuerst (Propagation-Delay abwarten), dann Broker-Deploy
          kubectl apply -f deploy/k8s/operator-rbac.yaml
          sleep 5
          # Kein sed mehr auf STORE_BACKEND: das Gate fuhr bisher gegen den
          # In-Memory-Store und pruefte damit ausgerechnet die Persistenz
          # nicht, die im Betrieb zaehlt. Jetzt laeuft es gegen den CRD-Store.
          sed -e 's|image: osb-broker-go:v[0-9]*|image: osb-broker-go:pr|' \
              deploy/k8s/broker.yaml | kubectl apply -f -
          kubectl rollout status deployment/osb-broker-go -n osb --timeout=120s
          sleep 3
          echo "--- RBAC self-check ---"
          echo "Pod SA: $(kubectl get pod -n osb -l app=osb-broker-go -o jsonpath='{.items[0].spec.serviceAccountName}')"
          echo "Role rules: $(kubectl get role osb-broker-state -n osb -o jsonpath='{.rules}')"
          echo "can-i create instances: $(kubectl auth can-i --as=system:serviceaccount:osb:osb-broker-go create osbserviceinstances.broker.osb.io -n osb)"
          echo "can-i create bindings: $(kubectl auth can-i --as=system:serviceaccount:osb:osb-broker-go create osbservicebindings.broker.osb.io -n osb)"
          kubectl get role,rolebinding -n osb || true

      - name: Run osb-checker against the PR broker
        run: |
          kubectl port-forward -n osb svc/osb-broker-go 18080:80 &
          PF_PID=$!
          sleep 3
          curl -s -o /dev/null -w "healthz: %{http_code}\n" http://localhost:18080/healthz
          set +e
          /tmp/osb-checker --url http://localhost:18080 --user chk --pass chkpass \
            --id-prefix pr-${{ github.event.number }} | tee /tmp/checker.log
          RC="${PIPESTATUS[0]}"
          set -e
          kill "$PF_PID" 2>/dev/null || true
          cat /tmp/checker.log >> "$GITHUB_STEP_SUMMARY" || true
          exit "$RC"

      - name: Zustand liegt wirklich in CRs
        if: always()
        run: |
          # Der Checker raeumt am Ende auf, deshalb zaehlt hier nicht die
          # Anzahl - sondern dass die Ressourcenart existiert und der Broker
          # sie benutzen durfte. Ein stiller Rueckfall auf In-Memory faellt
          # damit auf.
          kubectl get osbserviceinstances.broker.osb.io -n osb || true
          kubectl get osbservicebindings.broker.osb.io -n osb || true
          kubectl logs -n osb deployment/osb-broker-go --tail=30 | grep -i "state store" || true

      - name: Upload checker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-log
          path: /tmp/checker.log

  conformance-tls:
    name: L2b — TLS/mTLS-Conformance (kind + Helm + osb-checker über HTTPS)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build checker from PR code
        run: go build -o /tmp/osb-checker ./cmd/osb-checker/

      - name: Generate CA, server and client certificates
        run: |
          set -e
          mkdir -p /tmp/certs && cd /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -keyout ca.key -out ca.crt -subj "/CN=osb-ci-ca"
          # The checker reaches the broker through kubectl port-forward, so
          # the server certificate must be valid for localhost as well as
          # for the in-cluster service names.
          openssl req -newkey rsa:2048 -nodes -keyout tls.key -out server.csr \
            -subj "/CN=osb-broker-go"
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 1 -sha256 -out tls.crt \
            -extfile <(printf "subjectAltName=DNS:localhost,DNS:osb-broker-go,DNS:osb-broker-go.osb.svc,DNS:osb-broker-go.osb.svc.cluster.local,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n")
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr \
            -subj "/CN=osb-checker"
          openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 1 -sha256 -out client.crt \
            -extfile <(printf "extendedKeyUsage=clientAuth\n")

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-tls
          wait: 30s

      - name: Deploy broker over TLS via the Helm chart
        run: |
          set -e
          docker build -q -t osb-broker-go:pr .
          kind load docker-image osb-broker-go:pr --name ci-tls
          kubectl create namespace osb --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/crds/
          kubectl wait --for condition=established --timeout=60s \
            crd/osbserviceinstances.broker.osb.io crd/osbservicebindings.broker.osb.io
          kubectl create secret tls osb-broker-tls -n osb \
            --cert=/tmp/certs/tls.crt --key=/tmp/certs/tls.key \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic osb-broker-clientca -n osb \
            --from-file=ca.crt=/tmp/certs/ca.crt \
            --dry-run=client -o yaml | kubectl apply -f -
          # The chart is what carries TLS; this is also the only CI job that
          # exercises it at all.
          helm upgrade --install osb deploy/helm/osb-broker-go -n osb \
            -f deploy/helm/osb-broker-go/values-ci.yaml \
            --wait --timeout 180s
          kubectl rollout status deployment/osb-broker-go -n osb --timeout=120s

      - name: Run osb-checker over HTTPS with a client certificate
        run: |
          kubectl port-forward -n osb svc/osb-broker-go 18443:443 &
          PF_PID=$!
          sleep 3
          # No client certificate here on purpose: proves the probes' path
          # stays open under VerifyClientCertIfGiven.
          curl -sS --cacert /tmp/certs/ca.crt \
            -o /dev/null -w "healthz: %{http_code}\n" https://localhost:18443/healthz
          set +e
          /tmp/osb-checker --url https://localhost:18443 \
            --ca-cert /tmp/certs/ca.crt \
            --client-cert /tmp/certs/client.crt --client-key /tmp/certs/client.key \
            --user chk --pass chkpass \
            --id-prefix tls-${{ github.event.number }} | tee /tmp/checker-tls.log
          RC="${PIPESTATUS[0]}"
          set -e
          kill "$PF_PID" 2>/dev/null || true
          cat /tmp/checker-tls.log >> "$GITHUB_STEP_SUMMARY" || true
          exit "$RC"

      - name: Broker logs on failure
        if: failure()
        run: kubectl logs -n osb deployment/osb-broker-go --tail=100 || true

      - name: Upload checker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-tls-log
          path: /tmp/checker-tls.log

  release:
    name: L3 — Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify, conformance, conformance-tls]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
