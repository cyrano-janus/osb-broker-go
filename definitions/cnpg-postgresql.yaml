apiVersion: broker.osb.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: cnpg-postgresql
spec:
  offering:
    id: f48a9e21-cnpg-0000-0000-000000000001
    name: cnpg-postgresql
    description: "CloudNativePG PostgreSQL clusters"
    bindable: true
    tags:
      - postgresql
      - database
      - cnpg
    # Anzeigeblock des Marktplatzes. OSB schreibt keine Schluessel vor;
    # Cloud Foundry und Tanzu Apps Manager lesen diese. Ohne sie zeigt eine
    # Kachel den technischen Namen und sonst nichts.
    metadata:
      displayName: "PostgreSQL"
      longDescription: >-
        Ein PostgreSQL-Cluster, betrieben von CloudNativePG. Der Operator
        uebernimmt Failover, Backups und Wartung; der Broker liefert die
        Zugangsdaten als Binding.
      providerDisplayName: "CloudNativePG"
      documentationUrl: "https://cloudnative-pg.io/documentation/"
      supportUrl: "https://github.com/cloudnative-pg/cloudnative-pg/issues"
    plans:
      - id: plan-small-0000-0000-000000000001
        name: small
        metadata:
          displayName: "Small"
          bullets:
            - "1 Instanz, kein Failover"
            - "1Gi Speicher, bis 5Gi einstellbar"
            - "Loeschen entfernt die Daten"
        description: "Single instance, 1Gi storage"
        params:
          storageSize: 1Gi
          instances: 1
        # Was der Benutzer setzen darf:
        #   cf create-service ... -c '{"storageSize":"5Gi"}'
        # Jeder Schluessel, der hier nicht steht, ist 400. Ein gesetzter Wert
        # ueberschreibt den gleichnamigen Planwert; alles Uebrige bleibt.
        allowedParameters: [storageSize]
        # Erlaubt heisst nicht unbegrenzt. Ohne diese Grenze liesse sich der
        # Plan "small" mit 10Ti provisionieren, und der Betreiber saehe es an
        # der Rechnung. Steht auch als Plan-Schema im Katalog.
        parameterLimits:
          storageSize: {max: 5Gi}
      - id: plan-large-0000-0000-000000000002
        name: large
        metadata:
          displayName: "Large"
          bullets:
            - "3 Instanzen mit Failover"
            - "10Gi Speicher, bis 50Gi einstellbar"
            - "Loeschen laesst die Daten stehen"
        description: "HA, 3 instances, 10Gi storage. Deleting the service keeps the data."
        params:
          storageSize: 10Gi
          instances: 3
        allowedParameters: [storageSize]
        parameterLimits:
          storageSize: {max: 50Gi}
        # Ein Produktionsplan verliert seine Daten nicht auf einen
        # Tastendruck. Der Broker gibt die Instanz auf, der Cluster bleibt
        # stehen und traegt osb.io/retained-instance.
        retainOnDeprovision: true

  provision:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    template: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: {{ .safeName }}
        labels:
          app.kubernetes.io/managed-by: osb-broker-go
          osb.io/instance-id: {{ .instanceID }}
      spec:
        instances: {{ .plan.instances }}
        storage:
          size: {{ .plan.storageSize }}

  readiness:
    statusJSONPath: 'status.conditions.#(type=="Ready").status'
    expectedValue: "True"
    timeoutSeconds: 600

  bind:
    credentialsFromSecret: "{{ .safeName }}-app"
