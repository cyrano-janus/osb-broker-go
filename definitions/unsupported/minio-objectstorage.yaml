apiVersion: broker.osb.io/v1alpha1
kind: ServiceDefinition
metadata:
  name: minio-objectstorage
spec:
  offering:
    id: c9d8e7f6-minio-0000-0000-000000000001
    name: minio-objectstorage
    description: "[DEPRECATED — MinIO Community EOL, minio-operator deprecated. Nachfolger: seaweedfs-s3] MinIO S3-compatible object storage via minio-operator"
    tags: [s3, objectstorage, minio]
    plans:
      - id: plan-minio-small-0000-0000-000000000001
        name: small
        description: "Single tenant, 10Gi"
        params:
          servers: 1
          volumesPerServer: 1
          size: 10Gi
      - id: plan-minio-large-0000-0000-000000000002
        name: large
        description: "4 servers x 2 volumes, 50Gi each (erasure coded)"
        params:
          servers: 4
          volumesPerServer: 2
          size: 50Gi

  provision:
    apiVersion: minio.min.io/v2
    kind: Tenant
    template: |
      apiVersion: minio.min.io/v2
      kind: Tenant
      metadata:
        name: {{ .instanceID }}
        labels:
          app.kubernetes.io/managed-by: osb-broker-go
      spec:
        pools:
          - servers: {{ .plan.servers }}
            volumesPerServer: {{ .plan.volumesPerServer }}
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: {{ .plan.size }}
        requestCert: false
        prometheusOperator: false
  readiness:
    # Der Tenant fuehrt KEINE conditions. Sein CRD kennt unter status nur
    # currentState, healthStatus, availableReplicas und Aehnliches - ein Pfad
    # auf conditions haette nie zutreffen koennen und jede Instanz ins
    # Zeitlimit laufen lassen.
    #
    # currentState ist die Zustandsmaschine des Operators; "Initialized" ist
    # ihr Endzustand (StatusInitialized in pkg/controller des Operators, auch
    # als Spalte "State" im CRD gefuehrt). healthStatus waere die Alternative,
    # nennt aber die Guete des laufenden Tenants (green/yellow/red) und nicht,
    # ob er fertig hergestellt ist.
    statusJSONPath: 'status.currentState'
    expectedValue: "Initialized"
    timeoutSeconds: 600

  bind:
    # Der MinIO-Operator legt pro Tenant ein Secret "<tenant>-secret" mit
    # accessKey/secretKey an.
    credentialsFromSecret: "{{ .instanceID }}-secret"
