# Default values for osb-broker-go.

replicaCount: 1

image:
  repository: ghcr.io/cyrano-janus/osb-broker-go
  tag: ""            # leer = .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  # 443 matches the HTTPS default below. With tls.enabled=false set this
  # back to 80.
  port: 443

# TLS-Terminierung im Broker (Phase 4.5). HTTPS ist der Betriebszustand;
# tls.enabled=false fällt auf reines HTTP zurück (lokale Entwicklung).
#
# Das Serverzertifikat kommt entweder aus einem vorhandenen
# kubernetes.io/tls-Secret (`existingSecret`) oder von cert-manager
# (`certManager.enabled`) - beides gleichzeitig ist ein Fehler.
#
# Rotation braucht keinen Pod-Neustart: der Broker liest Zertifikat und
# Client-CA alle `reloadInterval` neu ein.
tls:
  enabled: true
  existingSecret: ""
  mountPath: /etc/osb/tls
  minVersion: "1.2"        # 1.2 | 1.3
  reloadInterval: 30s
  certManager:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: ""             # Pflichtangabe, sonst schlägt das Rendern fehl
    duration: 2160h        # 90 Tage
    renewBefore: 360h      # 15 Tage vorher erneuern
    dnsNames: []           # leer = <fullname>[.namespace[.svc[.cluster.local]]]

# Authentifizierung. Jede aktivierte Methode genügt für sich; Cloud Foundry
# schickt Basic Auth, zertifikatsbasierte Clients kommen über mTLS.
#
# Basic Auth: wenn create=true, legt das Chart das Secret an; sonst muss
# `existingSecret` existieren (keys: username, password).
auth:
  create: true
  existingSecret: ""
  username: broker-user
  password: "change-me"

  # mTLS: Client-Zertifikate gegen `caSecretName` prüfen und die Identität
  # gegen die Allowlists abgleichen. Leere Allowlists akzeptieren JEDES von
  # dieser CA signierte Zertifikat - der Broker warnt dann beim Start.
  mtls:
    enabled: false
    # required: true schaltet crypto/tls auf RequireAndVerifyClientCert.
    # Kubelet-Probes legen kein Client-Zertifikat vor; das Chart stellt sie
    # dann automatisch auf tcpSocket um, und ein Prometheus-Scrape auf
    # /metrics braucht ein eigenes Zertifikat.
    required: false
    caSecretName: ""       # Secret mit dem Client-CA-Bundle
    caKey: ca.crt
    mountPath: /etc/osb/ca
    allowedCNs: []
    allowedDNSNames: []
    allowedURIs: []        # z. B. spiffe://osb/checker

# Broker-Konfiguration (Umgebungsvariablen)
config:
  # crd  = ein OSBServiceInstance/OSBServiceBinding je Datensatz (Phase 5).
  #        Setzt voraus, dass die CRDs installiert sind:
  #          kubectl apply -f deploy/crds/
  # memory = geht beim Neustart verloren, nur fuer lokale Laeufe.
  storeBackend: crd
  # Eine Protokollzeile je Request (LOG_REQUESTS). Standard an: ein Broker, der
  # stumm laeuft, ist im Fehlerfall nicht nachvollziehbar. Abschaltbar, weil
  # das bei hoher Last teuer wird und manche Betreiber es am Ingress fuehren.
  logRequests: true

# ServiceDefinitions als ConfigMap gerendert.
# Jeder Eintrag unter `files` wird zu einer Datei in DEFINITIONS_DIR.
definitions:
  create: true
  # files:
  #   cnpg-postgresql.yaml: |
  #     apiVersion: broker.osb.io/v1alpha1
  #     ...

# RBAC: eigene State-CRDs und Credentials-Secrets im Release-Namespace +
# optionaler clusterweiter Zugriff auf Operator-CRs (z. B. postgresql.cnpg.io).
rbac:
  create: true
  # Diese Liste und definitions/ haelt internal/chart/sync_test.go zusammen, und
  # zwar in beide Richtungen: eine fehlende Gruppe ist 403 beim Provision - also
  # erst beim Kunden -, eine ueberfluessige ein clusterweites Recht zu viel.
  #
  # Geprueft wird nur die Vollstaendigkeit, nicht der Ressourcenname: der Plural
  # laesst sich aus dem Kind nicht sicher ableiten (der von "Redis" ist "redis").
  # Deshalb bleibt die Liste handgepflegt.
  operatorCRDs:
    - group: postgresql.cnpg.io
      resources: [clusters]
      verbs: [create, get, list, update, delete]
    - group: rabbitmq.com
      resources: [rabbitmqclusters]
      verbs: [create, get, list, update, delete]
    - group: seaweed.seaweedfs.com
      resources: [seaweeds]
      verbs: [create, get, list, update, delete]
  secretsAcrossNamespaces: true   # ClusterRole für Secret-Reads (Bind)
  # Schreibrechte auf Secrets in allen Namespaces. Nur nötig für Definitionen
  # mit spec.bind.projectSecret (Phase 6.4) - sie legen das Binding
  # zusätzlich als spec-konformes Secret im Ziel-Namespace ab, damit
  # Kubernetes-Workloads es nutzen können.
  #
  # Bleibt es aus, während eine Definition projectSecret setzt, schlägt der
  # Bind mit einer Meldung fehl, die genau diese fehlende Berechtigung nennt.
  projectedBindingSecrets: false

# Der Container läuft als nonroot (UID/GID 65532, distroless). fsGroup
# sorgt dafür, dass die gemounteten Secret-Dateien für diese Gruppe lesbar
# sind - ohne das scheitert der Broker beim Öffnen seines eigenen Keys.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus-Metriken (Phase 4.3)
metrics:
  enabled: true
