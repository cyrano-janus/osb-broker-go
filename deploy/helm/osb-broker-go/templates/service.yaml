apiVersion: v1
kind: Service
metadata:
  name: {{ include "osb-broker-go.fullname" . }}
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "osb-broker-go.selectorLabels" . | nindent 4 }}
