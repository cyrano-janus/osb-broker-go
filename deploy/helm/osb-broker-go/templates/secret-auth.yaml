{{- if .Values.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osb-broker-go.authSecretName" . }}
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
{{- end }}
