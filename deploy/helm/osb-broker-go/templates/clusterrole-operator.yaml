{{- if and .Values.rbac.create .Values.rbac.operatorCRDs }}
# Clusterweiter Zugriff auf die Operator-CRDs, die in den ServiceDefinitions
# referenziert werden (der Broker provisioniert CRs im Space-Namespace des
# Konsumenten und liest Bind-Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osb-broker-go.fullname" . }}-operators
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
rules:
{{- range .Values.rbac.operatorCRDs }}
- apiGroups: [{{ .group | quote }}]
  resources: {{ toJson .resources }}
  verbs: {{ toJson (default (list "create" "get" "update" "delete") .verbs) }}
{{- end }}
{{- if .Values.rbac.secretsAcrossNamespaces }}
- apiGroups: [""]
  resources: ["secrets"]
  verbs: [get]
{{- end }}
{{- if .Values.rbac.projectedBindingSecrets }}
# Schreibrechte auf Secrets in JEDEM Namespace - noetig fuer Definitionen mit
# spec.bind.projectSecret (Phase 6.4), die das Binding zusaetzlich als
# spec-konformes Secret im Ziel-Namespace ablegen.
#
# Bewusst eine eigene Option und nicht Teil von secretsAcrossNamespaces: das
# ist Lesen, dies ist Schreiben. RBAC kann nicht auf Labels einschraenken, die
# Berechtigung gilt also fuer alle Secrets. Wer 6.4 nicht braucht, laesst sie
# aus.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: [create, update, patch, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osb-broker-go.fullname" . }}-operators
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "osb-broker-go.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "osb-broker-go.fullname" . }}-operators
  apiGroup: rbac.authorization.k8s.io
{{- end }}
