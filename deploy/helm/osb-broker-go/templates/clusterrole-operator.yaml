{{- if and .Values.rbac.create .Values.rbac.operatorCRDs }}
# Clusterweiter Zugriff auf die Operator-CRDs, die in den ServiceDefinitions
# referenziert werden (der Broker provisioniert CRs im Space-Namespace des
# Konsumenten und liest Bind-Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "osb-broker-go.fullname" . }}-operators
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
rules:
{{- range .Values.rbac.operatorCRDs }}
- apiGroups: [{{ .group | quote }}]
  resources: {{ toJson .resources }}
  verbs: {{ toJson (default (list "create" "get" "update" "delete") .verbs) }}
{{- end }}
{{- if .Values.rbac.secretsAcrossNamespaces }}
- apiGroups: [""]
  resources: ["secrets"]
  verbs: [get]
{{- end }}
# Namespaces LESEN, immer. Der Broker prueft vor dem Provision, ob der
# Ziel-Namespace da ist - nur so kann er sagen, WELCHER fehlt, statt den
# Betreiber mit einem Apply-Fehler auf die Suche im Broker zu schicken.
#
# `get` auf Namespaces verraet nichts, was ein Betreiber nicht ohnehin sieht,
# und fehlt das Recht doch, laesst der Broker die Pruefung aus statt
# abzulehnen: ein verweigertes Lesen ist kein Beweis, dass etwas fehlt.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: [get]
{{- if .Values.rbac.manageNamespaces }}
# Namespaces ANLEGEN - noetig fuer config.instanceNamespaceCreate.
#
# Das weitreichendste Recht im Chart und deshalb ausdruecklich einzuschalten:
# wer es gibt, erlaubt dem Broker, ueberall im Cluster einen Namespace zu
# erzeugen.
#
# `delete` steht bewusst NICHT dabei: der Broker raeumt keinen Namespace ab,
# weil OSB nur das Loeschen einer Instanz kennt und nicht das Ende eines
# Mandanten (ADR 0010).
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: [create]
{{- end }}
{{- if .Values.rbac.projectedBindingSecrets }}
# Schreibrechte auf Secrets in JEDEM Namespace - noetig fuer Definitionen mit
# spec.bind.projectSecret (Phase 6.4), die das Binding zusaetzlich als
# spec-konformes Secret im Ziel-Namespace ablegen.
#
# Bewusst eine eigene Option und nicht Teil von secretsAcrossNamespaces: das
# ist Lesen, dies ist Schreiben. RBAC kann nicht auf Labels einschraenken, die
# Berechtigung gilt also fuer alle Secrets. Wer 6.4 nicht braucht, laesst sie
# aus.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: [create, update, patch, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "osb-broker-go.fullname" . }}-operators
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "osb-broker-go.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "osb-broker-go.fullname" . }}-operators
  apiGroup: rbac.authorization.k8s.io
{{- end }}
