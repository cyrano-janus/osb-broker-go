{{- if .Values.rbac.create }}
# Rechte auf den eigenen Zustand (Phase 5).
#
# Vorher stand hier eine einzelne ConfigMap, per resourceNames festgenagelt -
# was in der Praxis nicht funktionierte: Kubernetes wertet resourceNames bei
# `create` nicht aus, weil der Name zum Zeitpunkt der Autorisierung noch nicht
# feststeht. Der Broker brauchte deshalb eine zusaetzliche, breitere Role
# ausserhalb des Charts (korifi-platform, FINDINGS #1).
#
# Mit einem Objekt je Datensatz entfaellt das Problem: die Rechte gelten fuer
# eine eigene Ressourcenart, nicht fuer ein einzelnes Objekt einer geteilten.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "osb-broker-go.fullname" . }}-state
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
rules:
- apiGroups: ["broker.osb.io"]
  resources: ["osbserviceinstances", "osbservicebindings"]
  verbs: [get, list, watch, create, update, patch, delete]
# Die Credentials der Bindings liegen in Secrets, nicht in den CRs
# (FINDINGS #19). Nur im eigenen Namespace - der clusterweite Lesezugriff auf
# fremde Operator-Secrets steht getrennt in clusterrole-operator.yaml.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "osb-broker-go.fullname" . }}-state
  labels:
    {{- include "osb-broker-go.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "osb-broker-go.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "osb-broker-go.fullname" . }}-state
  apiGroup: rbac.authorization.k8s.io
{{- end }}
