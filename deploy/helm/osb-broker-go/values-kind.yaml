# Werte für das lokale Korifi/kind-Setup (entspricht deploy/k8s/*)
image:
  repository: osb-broker-go
  tag: v9
  pullPolicy: IfNotPresent

auth:
  username: broker-user
  password: broker-secret

  # mTLS für zertifikatsbasierte Clients (osb-checker, eigene Consumer).
  # Korifi selbst authentifiziert sich weiterhin per Basic Auth über TLS.
  mtls:
    enabled: false
    required: false
    caSecretName: osb-broker-clientca
    allowedCNs:
      - osb-checker

# HTTPS im kind-Cluster. Voraussetzung: cert-manager läuft und ein
# CA-ClusterIssuer existiert; dessen Root-CA muss in den Trust-Stores der
# Korifi-Pods liegen, sonst lehnt Korifi den Broker beim Registrieren ab
# (experimental.managedServices.trustInsecureBrokers steht per Default auf
# false). Siehe docs/tls-korifi.md.
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: osb-ca-issuer

definitions:
  create: true
  # Gebündelte Definitionen aus definitions/ des Repos
  files:
    cnpg-postgresql.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: cnpg-postgresql
      spec:
        offering:
          id: f48a9e21-cnpg-0000-0000-000000000001
          name: cnpg-postgresql
          description: "CloudNativePG PostgreSQL clusters"
          bindable: true
          tags:
            - postgresql
            - database
            - cnpg
          plans:
            - id: plan-small-0000-0000-000000000001
              name: small
              description: "Single instance, 1Gi storage"
              params:
                storageSize: 1Gi
                instances: 1
            - id: plan-large-0000-0000-000000000002
              name: large
              description: "HA, 3 instances, 10Gi storage"
              params:
                storageSize: 10Gi
                instances: 3

        provision:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          template: |
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              instances: {{ .plan.instances }}
              storage:
                size: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          credentialsFromSecret: "{{ .safeName }}-app"
    minio-objectstorage.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: minio-objectstorage
      spec:
        offering:
          id: c9d8e7f6-minio-0000-0000-000000000001
          name: minio-objectstorage
          description: "MinIO S3-compatible object storage via minio-operator"
          tags: [s3, objectstorage, minio]
          plans:
            - id: plan-minio-small-0000-0000-000000000001
              name: small
              description: "Single tenant, 10Gi"
              params:
                servers: 1
                volumesPerServer: 1
                size: 10Gi
            - id: plan-minio-large-0000-0000-000000000002
              name: large
              description: "4 servers x 2 volumes, 50Gi each (erasure coded)"
              params:
                servers: 4
                volumesPerServer: 2
                size: 50Gi

        provision:
          apiVersion: minio.min.io/v2
          kind: Tenant
          template: |
            apiVersion: minio.min.io/v2
            kind: Tenant
            metadata:
              name: {{ .instanceID }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
            spec:
              pools:
                - servers: {{ .plan.servers }}
                  volumesPerServer: {{ .plan.volumesPerServer }}
                  volumeClaimTemplate:
                    spec:
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: {{ .plan.size }}
              requestCert: false
              prometheusOperator: false
        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # Der MinIO-Operator legt pro Tenant ein Secret "<tenant>-secret" mit
          # accessKey/secretKey an.
          credentialsFromSecret: "{{ .instanceID }}-secret"
    redis-standalone.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: redis-standalone
      spec:
        offering:
          id: b7c2d3e4-redis-0000-0000-000000000001
          name: redis-standalone
          description: "Redis via Redis Operator (ot-container-kit)"
          tags: [redis, cache, in-memory]
          plans:
            - id: plan-redis-dev-0000-0000-000000000001
              name: dev
              description: "Single node, 128Mi"
              params:
                capacity: 128Mi
                replicas: 1
            - id: plan-redis-prod-0000-0000-000000000002
              name: prod
              description: "Leader + 2 followers, 1Gi"
              params:
                capacity: 1Gi
                replicas: 3

        provision:
          apiVersion: redis.redis.opstreelabs.in/v1beta2
          kind: Redis
          template: |
            apiVersion: redis.redis.opstreelabs.in/v1beta2
            kind: Redis
            metadata:
              name: {{ .instanceID }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
            spec:
              mode: standalone
              kubernetesConfig:
                image: quay.io/opstree/redis:v7.0.15
                redisExporter:
                  enabled: false
              storage:
                volumeClaimTemplate:
                  spec:
                    resources:
                      requests:
                        storage: {{ .plan.capacity }}
        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 300

        bind:
          # Der Opstree-Operator legt kein Credentials-Secret an; der Broker
          # erwartet daher, dass ein Platform-Admin das Secret vor dem ersten
          # Bind erzeugt (oder ein Sidecar dies tut). Konvention: <id>-redis.
          credentialsFromSecret: "{{ .instanceID }}-redis"
    valkey-cluster.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: valkey-cluster
      spec:
        offering:
          id: c8d4e5f6-valk-0000-0000-000000000001
          name: valkey-cluster
          description: "Valkey via valkey-io/valkey-operator"
          tags: [valkey, cache, in-memory, redis-compatible]
          plans:
            - id: plan-valkey-dev-0000-0000-000000000001
              name: dev
              description: "Single shard, 256Mi"
              params:
                shards: 1
                replicas: 0
                memory: 256Mi
            - id: plan-valkey-prod-0000-0000-000000000002
              name: prod
              description: "3 shards x 1 replica, 512Mi pro Pod"
              params:
                shards: 3
                replicas: 1
                memory: 512Mi

        provision:
          apiVersion: valkey.io/v1alpha1
          kind: ValkeyCluster
          template: |
            apiVersion: valkey.io/v1alpha1
            kind: ValkeyCluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              shards: {{ .plan.shards }}
              replicas: {{ .plan.replicas }}
              resources:
                requests:
                  memory: {{ .plan.memory }}
                  cpu: 100m
                limits:
                  memory: {{ .plan.memory }}
                  cpu: 500m

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 300

        bind:
          # Der valkey-operator legt kein Credentials-Secret an; Konvention wie bei
          # Redis: Platform-Admin erzeugt das Secret vor dem ersten Bind.
          credentialsFromSecret: "{{ .safeName }}-valkey"
    rabbitmq-cluster.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: rabbitmq-cluster
      spec:
        offering:
          id: d9e6f7a8-rabb-0000-0000-000000000001
          name: rabbitmq-cluster
          description: "RabbitMQ clusters via rabbitmq/cluster-operator"
          bindable: true
          tags:
            - rabbitmq
            - amqp
            - messaging
          plans:
            - id: plan-rabbit-dev-0000-0000-000000000001
              name: dev
              description: "Single node, 1Gi storage"
              params:
                replicas: 1
                storageSize: 1Gi
            - id: plan-rabbit-prod-0000-0000-000000000002
              name: prod
              description: "3-node HA cluster, 10Gi storage"
              params:
                replicas: 3
                storageSize: 10Gi

        provision:
          apiVersion: rabbitmq.com/v1beta1
          kind: RabbitmqCluster
          template: |
            apiVersion: rabbitmq.com/v1beta1
            kind: RabbitmqCluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              replicas: {{ .plan.replicas }}
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              persistence:
                storage: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # Der cluster-operator legt pro RabbitmqCluster automatisch ein
          # Default-User-Secret an (<name>-default-user mit username/password)
          # und referenziert es in status.binding.
          credentialsFromSecret: "{{ .safeName }}-default-user"
    redpanda-cluster.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: redpanda-cluster
      spec:
        offering:
          id: e7f5a8b9-redp-0000-0000-000000000001
          name: redpanda-cluster
          description: "Redpanda Kafka-compatible streaming via redpanda-operator"
          bindable: true
          tags:
            - kafka
            - streaming
            - redpanda
          plans:
            - id: plan-redpanda-dev-0000-0000-000000000001
              name: dev
              description: "Single broker, developer mode, 1Gi storage"
              params:
                replicas: 1
                storageSize: 1Gi
                memory: 1.2Gi
            - id: plan-redpanda-prod-0000-0000-000000000002
              name: prod
              description: "3 brokers, 10Gi storage each"
              params:
                replicas: 3
                storageSize: 10Gi
                memory: 2Gi

        provision:
          # Legacy-CRD des Operators (einzelnes CR mit voller Spec).
          apiVersion: redpanda.vectorized.io/v1alpha1
          kind: Cluster
          template: |
            apiVersion: redpanda.vectorized.io/v1alpha1
            kind: Cluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              image: "redpandadata/redpanda"
              version: "v24.2.7"
              replicas: {{ .plan.replicas }}
              resources:
                requests:
                  cpu: 500m
                  memory: {{ .plan.memory }}
                limits:
                  cpu: "1"
                  memory: {{ .plan.memory }}
              configuration:
                rpcServer:
                  port: 33145
                kafkaApi:
                  - port: 9092
                adminApi:
                  - port: 9644
                schemaRegistry:
                  port: 8081
                pandaproxyApi:
                  - port: 8082
                developerMode: {{ if eq .plan.replicas 1 }}true{{ else }}false{{ end }}
              storage:
                capacity: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # Kein automatisches Credentials-Secret; Konvention wie bei Redis/Valkey.
          credentialsFromSecret: "{{ .safeName }}-redpanda"
    seaweedfs-s3.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: seaweedfs-s3
      spec:
        offering:
          id: f6a9b0c1-seaw-0000-0000-000000000001
          name: seaweedfs-s3
          description: "SeaweedFS S3-compatible object storage via seaweedfs-operator"
          bindable: true
          tags:
            - s3
            - objectstorage
            - seaweedfs
          plans:
            - id: plan-seaweed-dev-0000-0000-000000000001
              name: dev
              description: "Single master/volume/filer/s3, 2Gi"
              params:
                masterReplicas: 1
                volumeReplicas: 1
                volumeStorage: 2Gi
            - id: plan-seaweed-prod-0000-0000-000000000002
              name: prod
              description: "3 masters, replicated volumes, 10Gi"
              params:
                masterReplicas: 3
                volumeReplicas: 2
                volumeStorage: 10Gi

        provision:
          apiVersion: seaweed.seaweedfs.com/v1
          kind: Seaweed
          template: |
            apiVersion: seaweed.seaweedfs.com/v1
            kind: Seaweed
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              image: chrislusf/seaweedfs:latest
              volumeServerDiskCount: 1
              master:
                replicas: {{ .plan.masterReplicas }}
              volume:
                replicas: {{ .plan.volumeReplicas }}
                requests:
                  storage: {{ .plan.volumeStorage }}
              filer:
                replicas: {{ if eq .plan.masterReplicas 1.0 }}1{{ else }}2{{ end }}
                config: |
                  [leveldb2]
                  enabled = true
                  dir = "/data/filerldb2"
              s3:
                replicas: 1

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # S3Credentials/S3Identities-CRDs vorhanden; Konvention: Platform-Admin
          # legt vor dem ersten Bind ein Secret mit den S3-Credentials an.
          credentialsFromSecret: "{{ .safeName }}-seaweed"
    cnpg-postgresql.yaml: |
