# Werte für das lokale kind-Setup (entspricht deploy/k8s/*)
image:
  repository: osb-broker-go
  # Kein tag: die Version steht in Chart.yaml unter appVersion, und zwar dort
  # allein. Ein zweiter Pin hier war schon einmal eine andere Version als der
  # im Chart - und welche gilt, sieht man erst am laufenden Pod.
  pullPolicy: IfNotPresent

auth:
  username: broker-user
  password: broker-secret

  # mTLS für zertifikatsbasierte Clients (osb-checker, eigene Consumer).
  # Die Plattform selbst authentifiziert sich per Basic Auth über TLS.
  mtls:
    enabled: false
    required: false
    caSecretName: osb-broker-clientca
    allowedCNs:
      - osb-gate

# HTTPS im kind-Cluster. Voraussetzung: cert-manager läuft und ein
# CA-ClusterIssuer existiert.
#
# Ob die Plattform das Zertifikat annimmt, entscheidet SIE, nicht der Broker:
# er liest zwei Dateien und lädt sie nach. Eine Plattform, die prüft, braucht
# die ausstellende CA in ihrem Trust-Store - welcher der Wege dafür gilt, steht
# in docs/de/target-platforms.md.
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: osb-ca-issuer

# Abgleich bestehender Instanzen. Auf der Entwicklungsplattform kurz genug,
# um eine Definitionsaenderung ohne Warten zu sehen, und lang genug, um den
# API-Server nicht zu belasten.
config:
  reconcileInterval: 2m

# GENERIERT aus definitions/ - nicht von Hand bearbeiten.
#
# Gesichert: internal/chart/sync_test.go vergleicht zeichengleich gegen
# definitions/. Eine Kopie, die driftet, ist eine Auslieferung, die sich
# anders verhaelt als das Repo - und das faellt sonst erst beim Kunden auf.
# Die cnpg-postgresql-Definition verweist auf den Katalog; das Chart liefert ihn.
postgresImageCatalog:
  create: true

definitions:
  create: true
  files:
    cnpg-pgvector.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: cnpg-pgvector
      spec:
        offering:
          id: b3c7d1e2-pgvc-0000-0000-000000000001
          name: cnpg-pgvector
          description: "PostgreSQL 18 with the pgvector extension already enabled - vector similarity search for AI workloads"
          bindable: true
          tags:
            - postgresql
            - vector
            - embeddings
            - ai
            - cnpg
          # Was ein Entwickler bekommt, steht hier - nicht in der Doku eines
          # anderen Repositoriums. Der Katalog ist das Einzige, was er sieht, bevor
          # er `cf create-service` tippt.
          metadata:
            displayName: "PostgreSQL + pgvector"
            longDescription: >-
              Ein PostgreSQL-18-Cluster von CloudNativePG mit pgvector 0.8.1. Die
              Erweiterung ist beim Provisionieren bereits aktiviert - CREATE
              EXTENSION ist nicht noetig, der Typ `vector` und die Operatoren
              `<->`, `<#>` und `<=>` stehen in der Datenbank `app` sofort zur
              Verfuegung. Im Uebrigen ist es ein vollwertiges PostgreSQL: dieselben
              Zugangsdaten, dieselbe Clientbibliothek, kein zweites System neben der
              relationalen Datenbank. Wer keine Vektoren braucht, nimmt
              cnpg-postgresql - dieses Angebot ist an PostgreSQL 18 gebunden.
            providerDisplayName: "CloudNativePG"
            documentationUrl: "https://github.com/pgvector/pgvector#getting-started"
            supportUrl: "https://github.com/cloudnative-pg/cloudnative-pg/issues"
          plans:
            - id: plan-pgvector-small-0000-000000000001
              name: small
              metadata:
                displayName: "Small"
                bullets:
                  - "1 Instanz, kein Failover"
                  - "pgvector 0.8.1 in der Datenbank app aktiviert"
                  - "5Gi Speicher, bis 20Gi einstellbar"
                  - "Loeschen entfernt die Daten samt Indizes"
              description: "Single instance, 5Gi storage, pgvector enabled"
              params:
                storageSize: 5Gi
                instances: 1
              allowedParameters: [storageSize]
              # Ein HNSW-Index liegt im Speicher und auf der Platte; Vektordaten
              # wachsen schneller als der Betreiber schaetzt. Die Grenze steht
              # deshalb hoeher als beim relationalen Plan gleichen Namens.
              parameterLimits:
                storageSize: {max: 20Gi}
            - id: plan-pgvector-large-0000-000000000002
              name: large
              metadata:
                displayName: "Large"
                bullets:
                  - "3 Instanzen mit Failover"
                  - "pgvector 0.8.1 in der Datenbank app aktiviert"
                  - "50Gi Speicher, bis 200Gi einstellbar"
                  - "Loeschen laesst die Daten stehen"
              description: "HA, 3 instances, 50Gi storage, pgvector enabled. Deleting the service keeps the data."
              params:
                storageSize: 50Gi
                instances: 3
              allowedParameters: [storageSize]
              parameterLimits:
                storageSize: {max: 200Gi}
              retainOnDeprovision: true

        provision:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          # Zwei Dokumente. Das Cluster haengt die Erweiterung als ImageVolume ein,
          # die Database aktiviert sie - ohne das zweite waere die Bibliothek zwar
          # geladen, `CREATE EXTENSION vector` aber noch nicht gelaufen, und der Typ
          # `vector` existierte nicht.
          #
          # Beides braucht PostgreSQL 18 (extension_control_path) und Kubernetes
          # 1.33 (ImageVolume). Das Basisimage ist deshalb ausdruecklich gesetzt und
          # nicht dem Operator ueberlassen: eine Definition, die stillschweigend auf
          # einer aelteren Nebenversion landet, faellt erst beim Provision auf.
          #
          # Anders als cnpg-postgresql bietet dieses Angebot KEINE Wahl der Major
          # und haengt nicht am ClusterImageCatalog: 17 scheidet wegen
          # extension_control_path aus, und fuer 19 gibt es auf ghcr.io noch kein
          # pgvector-Image (gemessen am 2026-11-22: 0.8.x-18-trixie ist das
          # hoechste). Sobald eines erscheint, wandert auch dieses Angebot auf den
          # Katalog und den Parameter majorVersion - bis dahin sagt der Katalogtext
          # "an PostgreSQL 18 gebunden", und das ist die Wahrheit.
          template: |
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
              instances: {{ .plan.instances }}
              storage:
                size: {{ .plan.storageSize }}
              postgresql:
                extensions:
                  - name: pgvector
                    image:
                      reference: ghcr.io/cloudnative-pg/pgvector:0.8.1-18-trixie
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Database
            metadata:
              name: {{ .safeName }}-app
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              name: app
              owner: app
              cluster:
                name: {{ .safeName }}
              extensions:
                - name: vector
                  ensure: present

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          credentialsFromSecret: "{{ .safeName }}-app"
    cnpg-postgresql.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: cnpg-postgresql
      spec:
        offering:
          id: f48a9e21-cnpg-0000-0000-000000000001
          name: cnpg-postgresql
          description: "CloudNativePG PostgreSQL clusters - major version 17, 18 or 19, chosen per instance"
          bindable: true
          tags:
            - postgresql
            - database
            - cnpg
          # Anzeigeblock des Marktplatzes. OSB schreibt keine Schluessel vor;
          # Cloud Foundry und Tanzu Apps Manager lesen diese. Ohne sie zeigt eine
          # Kachel den technischen Namen und sonst nichts.
          metadata:
            displayName: "PostgreSQL"
            longDescription: >-
              Ein PostgreSQL-Cluster, betrieben von CloudNativePG. Der Operator
              uebernimmt Failover, Backups und Wartung; der Broker liefert die
              Zugangsdaten als Binding. Die Major-Version waehlt der Besitzer der
              Instanz: 17, 18 oder 19 ueber den Parameter majorVersion, Vorgabe
              ist 18. Der Wechsel auf eine hoehere Major ist ein Update der
              Instanz (cf update-service -c '{"majorVersion":"19"}'); waehrend des
              Wechsels steht die Datenbank, die Daten bleiben an Ort und Stelle.
              Nebenversionen pflegt der Betreiber rollierend, ohne Zutun des
              Besitzers.
            providerDisplayName: "CloudNativePG"
            documentationUrl: "https://cloudnative-pg.io/documentation/"
            supportUrl: "https://github.com/cloudnative-pg/cloudnative-pg/issues"
          plans:
            - id: plan-small-0000-0000-000000000001
              name: small
              metadata:
                displayName: "Small"
                bullets:
                  - "1 Instanz, kein Failover"
                  - "PostgreSQL 18, wahlweise 17 oder 19 (majorVersion)"
                  - "1Gi Speicher, bis 5Gi einstellbar"
                  - "Loeschen entfernt die Daten"
              description: "Single instance, 1Gi storage, PostgreSQL 17/18/19"
              params:
                storageSize: 1Gi
                instances: 1
                # Die Vorgabe ist die ZWEITneueste Major, nicht die neueste. Eine
                # Major-Version ist in den ersten Monaten nach Erscheinen die mit
                # den wenigsten Erweiterungen und Treibern, die sie schon stuetzen;
                # wer sie will, sagt es. Als Zeichenkette, weil oneOf Zeichenketten
                # vergleicht - ein JSON-Wert 19 wird vor dem Vergleich auf dieselbe
                # Form gebracht.
                majorVersion: "18"
              # Was der Benutzer setzen darf:
              #   cf create-service ... -c '{"storageSize":"5Gi","majorVersion":"19"}'
              # Jeder Schluessel, der hier nicht steht, ist 400. Ein gesetzter Wert
              # ueberschreibt den gleichnamigen Planwert; alles Uebrige bleibt.
              allowedParameters: [storageSize, majorVersion]
              # Erlaubt heisst nicht unbegrenzt. Ohne diese Grenze liesse sich der
              # Plan "small" mit 10Ti provisionieren, und der Betreiber saehe es an
              # der Rechnung. Steht auch als Plan-Schema im Katalog.
              #
              # Das Versionsfenster: die neueste Major und die zwei davor. Drei
              # Jahresversionen geben dem Besitzer rund zwei Jahre je Stand, bevor
              # er wechseln muss. Die Liste ist dieselbe in jedem Plan und bei
              # cnpg-pgvector enger - dort schreibt die Erweiterung die Major vor.
              # Wie die Liste wandert, steht in docs/de/versionsfenster.md.
              parameterLimits:
                storageSize: {max: 5Gi}
                majorVersion: {oneOf: ["17", "18", "19"]}
              # Der Stand des PLANS, nicht der Datenbank. Er steigt, wenn sich am
              # Gerenderten etwas aendert - die Vorgabe-Major, der Katalogverweis -,
              # und nur dann. Eine Instanz unter aelterem Stand zeigt in `cf
              # services` ein "upgrade available"; `cf upgrade-service` rendert sie
              # mit IHREN gespeicherten Parametern neu. Wer die Major ausdruecklich
              # gesetzt hat, behaelt sie dabei; wer die Vorgabe nahm, folgt ihr -
              # und das kann ein Major-Wechsel mit Stillstand sein, deshalb sagt
              # die description, was der Stand bedeutet.
              #
              # 1.0.0: Image aus dem ClusterImageCatalog statt Operator-Vorgabe,
              # Major als Parameter, Vorgabe 18.
              maintenanceInfo:
                version: "1.0.0"
                description: "Image aus dem Katalog des Betreibers, Vorgabe PostgreSQL 18; Major waehlbar ueber majorVersion. Instanzen ohne gesetzte majorVersion folgen der Vorgabe - ein Major-Wechsel haelt die Datenbank rund eine Minute an."
            - id: plan-large-0000-0000-000000000002
              name: large
              metadata:
                displayName: "Large"
                bullets:
                  - "3 Instanzen mit Failover"
                  - "PostgreSQL 18, wahlweise 17 oder 19 (majorVersion)"
                  - "10Gi Speicher, bis 50Gi einstellbar"
                  - "Loeschen laesst die Daten stehen"
              description: "HA, 3 instances, 10Gi storage, PostgreSQL 17/18/19. Deleting the service keeps the data."
              params:
                storageSize: 10Gi
                instances: 3
                majorVersion: "18"
              allowedParameters: [storageSize, majorVersion]
              parameterLimits:
                storageSize: {max: 50Gi}
                majorVersion: {oneOf: ["17", "18", "19"]}
              # Der Stand des PLANS, nicht der Datenbank. Er steigt, wenn sich am
              # Gerenderten etwas aendert - die Vorgabe-Major, der Katalogverweis -,
              # und nur dann. Eine Instanz unter aelterem Stand zeigt in `cf
              # services` ein "upgrade available"; `cf upgrade-service` rendert sie
              # mit IHREN gespeicherten Parametern neu. Wer die Major ausdruecklich
              # gesetzt hat, behaelt sie dabei; wer die Vorgabe nahm, folgt ihr -
              # und das kann ein Major-Wechsel mit Stillstand sein, deshalb sagt
              # die description, was der Stand bedeutet.
              #
              # 1.0.0: Image aus dem ClusterImageCatalog statt Operator-Vorgabe,
              # Major als Parameter, Vorgabe 18.
              maintenanceInfo:
                version: "1.0.0"
                description: "Image aus dem Katalog des Betreibers, Vorgabe PostgreSQL 18; Major waehlbar ueber majorVersion. Instanzen ohne gesetzte majorVersion folgen der Vorgabe - ein Major-Wechsel haelt die Datenbank rund eine Minute an."
              # Ein Produktionsplan verliert seine Daten nicht auf einen
              # Tastendruck. Der Broker gibt die Instanz auf, der Cluster bleibt
              # stehen und traegt osb.io/retained-instance.
              retainOnDeprovision: true

        provision:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          # Das Image steht NICHT hier, sondern in einem ClusterImageCatalog namens
          # `postgresql`. Das Helm-Chart liefert ihn mit (postgresImageCatalog in
          # values.yaml, dort stehen die Tags); wer den Broker anders ausrollt,
          # legt ihn selbst an. Die Definition nennt nur die Major.
          #
          # Warum so herum: Nebenversionen sind Sicherheitsstaende und Sache des
          # Betreibers. Stuende hier ein Image mit Nebenversion, muesste bei jedem
          # Patch die Definition geaendert, der Broker neu ausgerollt und jede
          # Instanz einzeln ueber maintenanceInfo nachgezogen werden. Aendert der
          # Betreiber stattdessen den Katalogeintrag, rollt CloudNativePG alle
          # Cluster dieser Major selbst nach, Replikas zuerst, dann Switchover.
          # Stuende hier ein Image OHNE Nebenversion (18-system-trixie), entschiede
          # der Image-Cache des Knotens, welche Nebenversion ein Pod bekommt.
          #
          # Die Major dagegen ist Sache des Besitzers: aendert sich `major`, fuehrt
          # der Operator ein Upgrade an Ort und Stelle durch (pg_upgrade --link),
          # und waehrenddessen steht der Cluster. Deshalb kommt sie als Parameter
          # und nicht aus dem Katalog.
          #
          # Fehlt der Katalog, scheitert jedes Provision am Readiness-Timeout und
          # der Cluster traegt die Bedingung ImageCatalogRef mit dem Grund. Das
          # Chart verweigert deshalb das Rendern, wenn diese Definition dabei ist
          # und weder postgresImageCatalog.create noch .existing gesetzt sind.
          template: |
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              imageCatalogRef:
                apiGroup: postgresql.cnpg.io
                kind: ClusterImageCatalog
                name: postgresql
                major: {{ .plan.majorVersion }}
              instances: {{ .plan.instances }}
              storage:
                size: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          credentialsFromSecret: "{{ .safeName }}-app"
    rabbitmq-cluster.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: rabbitmq-cluster
      spec:
        offering:
          id: d9e6f7a8-rabb-0000-0000-000000000001
          name: rabbitmq-cluster
          description: "RabbitMQ clusters via rabbitmq/cluster-operator"
          bindable: true
          tags:
            - rabbitmq
            - amqp
            - messaging
          metadata:
            displayName: "RabbitMQ"
            longDescription: >-
              Ein RabbitMQ-Cluster, betrieben vom RabbitMQ Cluster Operator.
              Spricht AMQP 0-9-1 und bringt die Management-Oberflaeche mit.
            providerDisplayName: "RabbitMQ"
            documentationUrl: "https://www.rabbitmq.com/kubernetes/operator/operator-overview"
            supportUrl: "https://github.com/rabbitmq/cluster-operator/issues"
          plans:
            - id: plan-rabbit-dev-0000-0000-000000000001
              name: dev
              metadata:
                displayName: "Dev"
                bullets:
                  - "1 Knoten, kein Failover"
                  - "1Gi Speicher, bis 5Gi einstellbar"
                  - "Loeschen entfernt die Daten"
              description: "Single node, 1Gi storage"
              params:
                replicas: 1
                storageSize: 1Gi
              # Was der Benutzer setzen darf:
              #   cf create-service ... -c '{"storageSize":"5Gi"}'
              # Jeder Schluessel, der hier nicht steht, ist 400. Ein gesetzter Wert
              # ueberschreibt den gleichnamigen Planwert; alles Uebrige bleibt.
              allowedParameters: [storageSize]
              parameterLimits:
                storageSize: {max: 5Gi}
            - id: plan-rabbit-prod-0000-0000-000000000002
              name: prod
              metadata:
                displayName: "Prod"
                bullets:
                  - "3 Knoten im Quorum"
                  - "10Gi Speicher, bis 50Gi einstellbar"
                  - "Loeschen laesst die Daten stehen"
              description: "3-node HA cluster, 10Gi storage. Deleting the service keeps the data."
              params:
                replicas: 3
                storageSize: 10Gi
              parameterLimits:
                storageSize: {max: 50Gi}
              # Wie beim Produktionsplan von CNPG: die Instanz wird aufgegeben, der
              # Cluster bleibt stehen und ist ueber osb.io/retained-instance
              # auffindbar.
              retainOnDeprovision: true
              allowedParameters: [storageSize]

        provision:
          apiVersion: rabbitmq.com/v1beta1
          kind: RabbitmqCluster
          template: |
            apiVersion: rabbitmq.com/v1beta1
            kind: RabbitmqCluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              replicas: {{ .plan.replicas }}
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              persistence:
                storage: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="AllReplicasReady").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # Der cluster-operator implementiert den Provisioned-Service-Duck-Type der
          # CNCF Service Binding Specification: er nennt sein Credentials-Secret
          # selbst in status.binding.name. Damit muss die Definition kein
          # Namensschema mehr nachbauen.
          provisionedService: true
          # Rueckfallebene fuer aeltere Operator-Versionen, die status.binding noch
          # nicht fuellen - das ist der bisherige Weg, unveraendert.
          credentialsFromSecret: "{{ .safeName }}-default-user"

          type: rabbitmq
          provider: rabbitmq-cluster-operator

          # Legt dieselben Credentials zusaetzlich als spec-konformes Secret im
          # Ziel-Namespace ab. Cloud Foundry braucht das nicht - es bekommt sie in
          # der OSB-Antwort -, aber ein Kubernetes-Workload sieht diese Antwort nie
          # und kommt nur ueber ein Secret an sein Binding.
          #
          # ACHTUNG: braucht Schreibrechte auf Secrets im Ziel-Namespace. Im
          # Helm-Chart ist das rbac.projectedBindingSecrets=true. Ohne die
          # Berechtigung schlaegt der Bind fehl - mit einer Meldung, die genau sie
          # benennt.
          projectSecret: true

          # Ohne mapping reicht der Broker alle Keys des Secrets durch - inklusive
          # default_user.conf, einer Konfigurationsdatei, die in einem Binding
          # nichts zu suchen hat (FINDINGS #23). Das mapping gibt die Zielform vor.
          mapping:
            - name: username
              from: username
            - name: password
              from: password
            - name: host
              from: host
            - name: port
              from: port
            - name: uri
              value: "amqp://{{ .credentials.username }}:{{ .credentials.password }}@{{ .credentials.host }}:{{ .credentials.port }}/"