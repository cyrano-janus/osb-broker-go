# Werte für das lokale Korifi/kind-Setup (entspricht deploy/k8s/*)
image:
  repository: osb-broker-go
  # Kein tag: die Version steht in Chart.yaml unter appVersion, und zwar dort
  # allein. Ein zweiter Pin hier war schon einmal eine andere Version als der
  # im Chart - und welche gilt, sieht man erst am laufenden Pod.
  pullPolicy: IfNotPresent

auth:
  username: broker-user
  password: broker-secret

  # mTLS für zertifikatsbasierte Clients (osb-checker, eigene Consumer).
  # Korifi selbst authentifiziert sich weiterhin per Basic Auth über TLS.
  mtls:
    enabled: false
    required: false
    caSecretName: osb-broker-clientca
    allowedCNs:
      - osb-gate

# HTTPS im kind-Cluster. Voraussetzung: cert-manager läuft und ein
# CA-ClusterIssuer existiert; dessen Root-CA muss in den Trust-Stores der
# Korifi-Pods liegen, sonst lehnt Korifi den Broker beim Registrieren ab
# (experimental.managedServices.trustInsecureBrokers steht per Default auf
# false). Siehe docs/de/how-to/korifi-trust.md.
tls:
  enabled: true
  certManager:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: osb-ca-issuer

# GENERIERT aus definitions/ - nicht von Hand bearbeiten.
#
# Gesichert: internal/chart/sync_test.go vergleicht zeichengleich gegen
# definitions/. Eine Kopie, die driftet, ist eine Auslieferung, die sich
# anders verhaelt als das Repo - und das faellt sonst erst beim Kunden auf.
definitions:
  create: true
  files:
    cnpg-postgresql.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: cnpg-postgresql
      spec:
        offering:
          id: f48a9e21-cnpg-0000-0000-000000000001
          name: cnpg-postgresql
          description: "CloudNativePG PostgreSQL clusters"
          bindable: true
          tags:
            - postgresql
            - database
            - cnpg
          plans:
            - id: plan-small-0000-0000-000000000001
              name: small
              description: "Single instance, 1Gi storage"
              params:
                storageSize: 1Gi
                instances: 1
              # Was der Benutzer setzen darf:
              #   cf create-service ... -c '{"storageSize":"5Gi"}'
              # Jeder Schluessel, der hier nicht steht, ist 400. Ein gesetzter Wert
              # ueberschreibt den gleichnamigen Planwert; alles Uebrige bleibt.
              allowedParameters: [storageSize]
              # Erlaubt heisst nicht unbegrenzt. Ohne diese Grenze liesse sich der
              # Plan "small" mit 10Ti provisionieren, und der Betreiber saehe es an
              # der Rechnung. Steht auch als Plan-Schema im Katalog.
              parameterLimits:
                storageSize: {max: 5Gi}
            - id: plan-large-0000-0000-000000000002
              name: large
              description: "HA, 3 instances, 10Gi storage"
              params:
                storageSize: 10Gi
                instances: 3
              allowedParameters: [storageSize]
              parameterLimits:
                storageSize: {max: 50Gi}

        provision:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          template: |
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              instances: {{ .plan.instances }}
              storage:
                size: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          credentialsFromSecret: "{{ .safeName }}-app"
    rabbitmq-cluster.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: rabbitmq-cluster
      spec:
        offering:
          id: d9e6f7a8-rabb-0000-0000-000000000001
          name: rabbitmq-cluster
          description: "RabbitMQ clusters via rabbitmq/cluster-operator"
          bindable: true
          tags:
            - rabbitmq
            - amqp
            - messaging
          plans:
            - id: plan-rabbit-dev-0000-0000-000000000001
              name: dev
              description: "Single node, 1Gi storage"
              params:
                replicas: 1
                storageSize: 1Gi
              # Was der Benutzer setzen darf:
              #   cf create-service ... -c '{"storageSize":"5Gi"}'
              # Jeder Schluessel, der hier nicht steht, ist 400. Ein gesetzter Wert
              # ueberschreibt den gleichnamigen Planwert; alles Uebrige bleibt.
              allowedParameters: [storageSize]
              parameterLimits:
                storageSize: {max: 5Gi}
            - id: plan-rabbit-prod-0000-0000-000000000002
              name: prod
              description: "3-node HA cluster, 10Gi storage"
              params:
                replicas: 3
                storageSize: 10Gi
              parameterLimits:
                storageSize: {max: 50Gi}
              allowedParameters: [storageSize]

        provision:
          apiVersion: rabbitmq.com/v1beta1
          kind: RabbitmqCluster
          template: |
            apiVersion: rabbitmq.com/v1beta1
            kind: RabbitmqCluster
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              replicas: {{ .plan.replicas }}
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              persistence:
                storage: {{ .plan.storageSize }}

        readiness:
          statusJSONPath: 'status.conditions.#(type=="AllReplicasReady").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # Der cluster-operator implementiert den Provisioned-Service-Duck-Type der
          # CNCF Service Binding Specification: er nennt sein Credentials-Secret
          # selbst in status.binding.name. Damit muss die Definition kein
          # Namensschema mehr nachbauen.
          provisionedService: true
          # Rueckfallebene fuer aeltere Operator-Versionen, die status.binding noch
          # nicht fuellen - das ist der bisherige Weg, unveraendert.
          credentialsFromSecret: "{{ .safeName }}-default-user"

          type: rabbitmq
          provider: rabbitmq-cluster-operator

          # Legt dieselben Credentials zusaetzlich als spec-konformes Secret im
          # Ziel-Namespace ab. Cloud Foundry braucht das nicht - es bekommt sie in
          # der OSB-Antwort -, aber ein Kubernetes-Workload sieht diese Antwort nie
          # und kommt nur ueber ein Secret an sein Binding.
          #
          # ACHTUNG: braucht Schreibrechte auf Secrets im Ziel-Namespace. Im
          # Helm-Chart ist das rbac.projectedBindingSecrets=true. Ohne die
          # Berechtigung schlaegt der Bind fehl - mit einer Meldung, die genau sie
          # benennt.
          projectSecret: true

          # Ohne mapping reicht der Broker alle Keys des Secrets durch - inklusive
          # default_user.conf, einer Konfigurationsdatei, die in einem Binding
          # nichts zu suchen hat (FINDINGS #23). Das mapping gibt die Zielform vor.
          mapping:
            - name: username
              from: username
            - name: password
              from: password
            - name: host
              from: host
            - name: port
              from: port
            - name: uri
              value: "amqp://{{ .credentials.username }}:{{ .credentials.password }}@{{ .credentials.host }}:{{ .credentials.port }}/"
    seaweedfs-s3.yaml: |
      apiVersion: broker.osb.io/v1alpha1
      kind: ServiceDefinition
      metadata:
        name: seaweedfs-s3
      spec:
        offering:
          id: f6a9b0c1-seaw-0000-0000-000000000001
          name: seaweedfs-s3
          description: "SeaweedFS S3-compatible object storage via seaweedfs-operator"
          bindable: true
          tags:
            - s3
            - objectstorage
            - seaweedfs
          plans:
            - id: plan-seaweed-dev-0000-0000-000000000001
              name: dev
              description: "Single master/volume/filer/s3, 2Gi"
              params:
                masterReplicas: 1
                volumeReplicas: 1
                volumeStorage: 2Gi
            - id: plan-seaweed-prod-0000-0000-000000000002
              name: prod
              description: "3 masters, replicated volumes, 10Gi"
              params:
                masterReplicas: 3
                volumeReplicas: 2
                volumeStorage: 10Gi

        provision:
          apiVersion: seaweed.seaweedfs.com/v1
          kind: Seaweed
          template: |
            apiVersion: seaweed.seaweedfs.com/v1
            kind: Seaweed
            metadata:
              name: {{ .safeName }}
              labels:
                app.kubernetes.io/managed-by: osb-broker-go
                osb.io/instance-id: {{ .instanceID }}
            spec:
              image: chrislusf/seaweedfs:latest
              volumeServerDiskCount: 1
              master:
                replicas: {{ .plan.masterReplicas }}
              volume:
                replicas: {{ .plan.volumeReplicas }}
                requests:
                  storage: {{ .plan.volumeStorage }}
              filer:
                replicas: {{ if eq .plan.masterReplicas 1.0 }}1{{ else }}2{{ end }}
                config: |
                  [leveldb2]
                  enabled = true
                  dir = "/data/filerldb2"
              s3:
                replicas: 1

        readiness:
          statusJSONPath: 'status.conditions.#(type=="Ready").status'
          expectedValue: "True"
          timeoutSeconds: 600

        bind:
          # Der Operator stellt S3Credentials/S3Identities-CRDs bereit; das
          # S3-Gateway liest Identities aus einem configSecret (seaweedfs_s3_config.json).
          # Konvention: Platform-Admin legt vor dem ersten Bind ein Secret mit den
          # S3-Credentials an. Konvention: <name>-seaweed.
          credentialsFromSecret: "{{ .safeName }}-seaweed"
