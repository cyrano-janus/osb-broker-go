# Zustand einer Service-Instanz (Phase 5).
#
# Cluster-weite Ressource, deshalb bewusst NICHT im Helm-Chart: eine
# namespaced Release, die cluster-weite Objekte anlegt, kollidiert mit jeder
# zweiten Release desselben Charts. Helms eigenes crds/-Verzeichnis waere die
# Alternative, wird aber bei `helm upgrade` nie aktualisiert - fuer ein
# v1alpha1, das sich noch bewegt, ist das die schlechtere Falle.
#
# Installation: kubectl apply -f deploy/crds/
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: osbserviceinstances.broker.osb.io
spec:
  group: broker.osb.io
  scope: Namespaced
  names:
    kind: OSBServiceInstance
    listKind: OSBServiceInstanceList
    plural: osbserviceinstances
    singular: osbserviceinstance
    shortNames: [osbi]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.serviceId
        - name: Plan
          type: string
          jsonPath: .spec.planId
        - name: Ready
          type: boolean
          jsonPath: .spec.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [id, serviceId, planId]
              properties:
                id:
                  type: string
                  description: >-
                    Die OSB-Instanz-ID, wie die Plattform sie geschickt hat.
                    Der Objektname ist davon nur abgeleitet, weil OSB-IDs
                    beliebige Strings sein duerfen - hier steht die Wahrheit.
                serviceId:
                  type: string
                planId:
                  type: string
                dashboardUrl:
                  type: string
                ready:
                  type: boolean
                  description: Ob das Provisioning abgeschlossen ist.
                context:
                  type: object
                  properties:
                    platform: {type: string}
                    organizationGuid: {type: string}
                    spaceGuid: {type: string}
                    clusterId: {type: string}
                    namespace: {type: string}
                    originatingIdentity: {type: string}
                parameters:
                  type: object
                  description: Frei geformte Benutzerparameter aus dem Provision-Request.
                  x-kubernetes-preserve-unknown-fields: true
                appliedObjects:
                  type: array
                  description: >-
                    Namen der fuer diese Instanz angelegten Objekte, damit
                    Deprovision auch nach einem Neustart alles abraeumt.
                  items: {type: string}
                appliedRefs:
                  type: array
                  description: >-
                    Dieselben Objekte mit GVK und Namespace. Der Namespace ist
                    mitgefuehrt, damit ein spaeterer Wechsel auf Namespaces je
                    Space keine Schema-Aenderung braucht.
                  items:
                    type: object
                    required: [apiVersion, kind, name]
                    properties:
                      apiVersion: {type: string}
                      kind: {type: string}
                      namespace: {type: string}
                      name: {type: string}
