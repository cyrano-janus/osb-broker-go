apiVersion: v1
kind: Namespace
metadata:
  name: osb
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osb-broker-go
  namespace: osb
---
# Least-privilege: the broker may only manage its own state ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osb-broker-state
  namespace: osb
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["osb-broker-state"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osb-broker-state
  namespace: osb
subjects:
- kind: ServiceAccount
  name: osb-broker-go
  namespace: osb
roleRef:
  kind: Role
  name: osb-broker-state
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osb-broker-go
  namespace: osb
  labels:
    app: osb-broker-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osb-broker-go
  template:
    metadata:
      labels:
        app: osb-broker-go
    spec:
      serviceAccountName: osb-broker-go
      containers:
      - name: broker
        image: osb-broker-go:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: STORE_BACKEND
          value: "k8s"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BROKER_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: osb-broker-auth
              key: username
        - name: BROKER_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: osb-broker-auth
              key: password
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: osb-broker-go
  namespace: osb
  labels:
    app: osb-broker-go
spec:
  type: ClusterIP
  selector:
    app: osb-broker-go
  ports:
  - name: http
    port: 80
    targetPort: 8080
