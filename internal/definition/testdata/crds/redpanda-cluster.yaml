_comment: 'Auszug aus dem CRD des Operators: Gruppe, Kind und das status-Schema. Mehr liest die Pruefung
  nicht, und die vollstaendigen CRDs sind bis zu 5 MB gross.'
_source: https://raw.githubusercontent.com/redpanda-data/redpanda-operator/v2.1.10-23.2.18/src/go/k8s/config/crd/bases/redpanda.vectorized.io_clusters.yaml
group: redpanda.vectorized.io
kind: Cluster
versions:
- name: v1alpha1
  status:
    description: ClusterStatus defines the observed state of Cluster
    properties:
      conditions:
        description: Current state of the cluster.
        items:
          description: ClusterCondition contains details for the current conditions of the cluster
          properties:
            lastTransitionTime:
              description: Last time the condition transitioned from one status to another
              format: date-time
              type: string
            message:
              description: Human-readable message indicating details about last transition
              type: string
            reason:
              description: Unique, one-word, CamelCase reason for the condition's last transition
              type: string
            status:
              description: Status is the status of the condition
              type: string
            type:
              description: Type is the type of the condition
              enum:
              - ClusterConfigured
              type: string
          required:
          - status
          - type
          type: object
        type: array
      currentReplicas:
        description: CurrentReplicas is the number of Pods that the controller currently wants to run
          for the cluster.
        format: int32
        type: integer
      decommissioningNode:
        description: Indicates that a node is currently being decommissioned from the cluster and provides
          its ordinal number
        format: int32
        type: integer
      nodes:
        description: Nodes of the provisioned redpanda nodes
        properties:
          external:
            items:
              type: string
            type: array
          externalAdmin:
            items:
              type: string
            type: array
          externalBootstrap:
            description: LoadBalancerStatus reports the load balancer status as generated by the load
              balancer core service
            properties:
              ingress:
                description: Ingress is a list containing ingress points for the load-balancer. Traffic
                  intended for the service should be sent to these ingress points.
                items:
                  description: 'LoadBalancerIngress represents the status of a load-balancer ingress point:
                    traffic intended for the service should be sent to an ingress point.'
                  properties:
                    hostname:
                      description: Hostname is set for load-balancer ingress points that are DNS based
                        (typically AWS load-balancers)
                      type: string
                    ip:
                      description: IP is set for load-balancer ingress points that are IP based (typically
                        GCE or OpenStack load-balancers)
                      type: string
                    ports:
                      description: Ports is a list of records of service ports If used, every port defined
                        in the service should have an entry in it
                      items:
                        properties:
                          error:
                            description: 'Error is to record the problem with the service port The format
                              of the error shall comply with the following rules: - built-in error values
                              shall be specified in this file and those shall use CamelCase names - cloud
                              provider specific error values must have names that comply with the format
                              foo.example.com/CamelCase. --- The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)'
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                          port:
                            description: Port is the port number of the service port of which status is
                              recorded here
                            format: int32
                            type: integer
                          protocol:
                            default: TCP
                            description: 'Protocol is the protocol of the service port of which status
                              is recorded here The supported values are: "TCP", "UDP", "SCTP"'
                            type: string
                        required:
                        - port
                        - protocol
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                  type: object
                type: array
            type: object
          externalPandaproxy:
            items:
              type: string
            type: array
          internal:
            items:
              type: string
            type: array
          pandaproxyIngress:
            type: string
          schemaRegistry:
            description: SchemaRegistryStatus reports addresses where schema registry can be reached
            properties:
              external:
                description: "External address should be registered in DNS provider using all public IP\
                  \ of a nodes that Redpanda is scheduled on. \n The External is empty when subdomain\
                  \ is not provided."
                type: string
              externalNodeIPs:
                description: ExternalNodeIPs is only filled when the Schema Registry external connectivity
                  feature flag is enabled, but the subdomain is empty. This gives user ability to register
                  all addresses individually in DNS provider of choice.
                items:
                  type: string
                type: array
              internal:
                type: string
            type: object
        type: object
      readyReplicas:
        description: ReadyReplicas is the number of Pods belonging to the cluster that have a Ready Condition.
        format: int32
        type: integer
      replicas:
        description: Replicas show how many nodes have been created for the cluster
        format: int32
        type: integer
      restarting:
        description: Indicates that a cluster is restarting due to an upgrade or a different reason
        type: boolean
      upgrading:
        description: 'Indicates cluster is upgrading. Deprecated: replaced by "restarting"'
        type: boolean
      version:
        description: Current version of the cluster.
        type: string
    type: object
